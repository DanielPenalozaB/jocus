services:
  # Reverse proxy - path-based routing so all devices access via IP
  traefik:
    image: traefik:latest
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock.raw:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - jocus-network
    restart: unless-stopped

  # Frontend - Next.js (catch-all, lowest priority)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - backend
    networks:
      - jocus-network
    restart: unless-stopped

  # Backend - Elixir/Phoenix (API + WebSocket)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - PHX_HOST=${DOMAIN}
    labels:
      - "traefik.enable=true"
      # API routes
      - "traefik.http.routers.backend-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.routers.backend-api.priority=10"
      - "traefik.http.routers.backend-api.service=backend"
      # WebSocket route
      - "traefik.http.routers.backend-ws.rule=PathPrefix(`/socket`)"
      - "traefik.http.routers.backend-ws.entrypoints=web"
      - "traefik.http.routers.backend-ws.priority=10"
      - "traefik.http.routers.backend-ws.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jocus-network
    restart: unless-stopped

  # Database
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jocus-network
    restart: unless-stopped

  # Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jocus-network
    restart: unless-stopped

  # Object storage for game assets (images, sounds)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=PathPrefix(`/assets`)"
      - "traefik.http.routers.minio.entrypoints=web"
      - "traefik.http.routers.minio.priority=10"
      - "traefik.http.routers.minio.service=minio"
      - "traefik.http.routers.minio.middlewares=minio-strip"
      - "traefik.http.middlewares.minio-strip.stripprefix.prefixes=/assets"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=PathPrefix(`/minio`)"
      - "traefik.http.routers.minio-console.entrypoints=web"
      - "traefik.http.routers.minio-console.priority=10"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.routers.minio-console.middlewares=minio-console-strip"
      - "traefik.http.middlewares.minio-console-strip.stripprefix.prefixes=/minio"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jocus-network
    restart: unless-stopped

  # Initializes Minio bucket on first run
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set jocus http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing jocus/$${MINIO_BUCKET};
      mc anonymous set download jocus/$${MINIO_BUCKET};
      exit 0;
      "
    networks:
      - jocus-network


volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  jocus-network:
    driver: bridge
